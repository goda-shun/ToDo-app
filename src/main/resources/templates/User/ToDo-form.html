<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ToDo新規登録画面</title>
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body>
    <header>
        <h1 class="header">
            <div class="header-title">ToDo新規登録画面</div>
        </h1>
    </header>
    
    <form th:action="@{/new}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="container">
        <div class="content">
            <label class="content-title">タスク名</label>
            <input type="text" class="task-name">
        </div>

        <div class="content">
            <label class="content-title">期限</label>
            <input type="date" class="limit-date">
        </div>

        <div class="content">
            <label for="password" class="content-title">詳細</label>
            <textarea></textarea>
        </div>
    </div>
    <div class="button">
        <button type="submit" class="create-button">登録</button>
        <button type="submit" class="cancel-button">キャンセル</button>
    </div>
</body>
</form>
</html>
