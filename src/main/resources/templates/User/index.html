<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ToDoアプリホーム画面</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>
    <header>
        <h1 class="header">
            <div class="header-title">ToDo一覧</div>
        </h1>
    </header>
    <table>
        <thead>
            <tr>
                <th></th>
                <th class="index-content-task-name">タスク名</div>
                <th class="index-content-limit-date">期限</div>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <!-- データが登録されたら表示する設定にする予定 start -->
        <tbody>
            <tr>
                <td>
                    <button type="submit" class="complete-button">完了</button>
                </td>
                <td class="index-content-task-name"></div>
                <td class="index-content-limit-date"></div>
                <td>
                    <button type="submit" class="edit-button">詳細</button>
                </td>
                <td>
                    <button type="submit" class="delete-button">削除</button>
                </td>
            </tr>
        </tbody>
        <!-- <tbody>
            <tr th:if="${todo.taskName != null or todo.limitDate != null}">
                <td>
                    <button type="submit" class="complete-button">完了</button>
                </td>
                <td class="index-content-task-name" th:text="${todo.taskName}"></td>
                <td class="index-content-limit-date" th:text="${todo.limitDate != null ? #temporals.format(todo.limitDate, 'yyyy/MM/dd') : ''}"></td>
                <td>
                    <button type="submit" class="edit-button">詳細</button>
                </td>
                <td>
                    <button type="submit" class="delete-button">削除</button>
                </td>
            </tr>
        </tbody> -->
        <!-- データが登録されたら表示する設定にする予定 end -->
    </table>
    <div class="button">
        <a th:href="@{/new}">
            <button class="new-create-button">ToDo<br>新規登録</button>
        </a>
        <a th:href="@{/complete-index}">
            <button class="complete-task-index-button">完了済み<br>ToDo一覧へ</button>
        </a>
    </div>
</body>
</html>
