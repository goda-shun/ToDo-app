<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ToDoアプリ一覧画面</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>

<body>
    <div>
        <header>
            <h1 class="header">
                <div class="header-title">ToDo一覧</div>
            </h1>
        </header>
        <table>
            <thead>
                <tr>
                    <th></th>
                    <th class="index-content-task-name">タスク名</th>
                    <th class="index-content-limit-date">期限</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}">
                    <td>
                        <form th:action="@{/complete/{id}(id=${todo.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="complete-button">完了</button>
                        </form>
                    </td>
                    <td class="index-content-task-name" th:text="${todo.taskName}"></td>
                    <td class="index-content-limit-date" th:text="${todo.limitDate}"></td>
                    <td>
                        <form th:action="@{/edit/{id}(id=${todo.id})}" method="get">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="edit-button">詳細</button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/delete/{id}(id=${todo.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="delete-button">削除</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(todos)}">
                    <td colspan="5" class="no-data-message">
                        現在ToDoはありません。
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="button">
            <!-- <a th:href="@{/new}" class="new-create-button">ToDo<br>新規登録</a>
            <a th:href="@{/complete-index}" class="complete-task-index-button">完了済み<br>ToDo一覧へ</a> -->
            <button type="button" class="new-create-button" onclick="location.href='/new'">ToDo<br>新規登録</button>
            <!-- 完了済みToDo一覧画面は未作成(別チケットで作成予定) -->
            <button type="button" class="complete-task-index-button"
                onclick="location.href='/'">完了済み<br>ToDo一覧へ</button>
        </div>
    </div>
</body>

</html>
