<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>

    <h1>ログイン</h1>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div>
            <label for="username">ユーザー名</label>
            <input type="text"
                   id="username"
                   name="username">
        </div>

        <div>
            <label for="password">パスワード</label>
            <input type="password"
                   id="password"
                   name="password">
        </div>

        <button type="submit">ログイン</button>

    </form>

</body>
</html>
